# Despliegue local del MCP Server.
# Uso: docker compose -f goals/mcp-deploy/docker-compose.yml up -d

services:
  mantis-goals:
    image: mantisagenticdev/mantis-goals:latest
    container_name: mantis-goals
    ports:
      - "8080:8080"
    volumes:
      - ./data/registry.db:/app/data/registry.db
      - ./data/agent-db:/app/data/agent-db
      - ./data/logs:/app/data/logs
      - ./data/backups:/app/data/backups
    environment:
      - MANTIS_DB_PATH=/app/data/registry.db
      - MANTIS_AGENT_DB_DIR=/app/data/agent-db
      - MANTIS_LOG_DIR=/app/data/logs
      - MANTIS_BACKUP_DIR=/app/data/backups
      - MANTIS_API_KEY=change-me-in-production
      - MANTIS_PORT=8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backup:
    image: mantisagenticdev/mantis-goals:latest
    container_name: mantis-backup
    entrypoint: ["python3", "/app/goals/mcp-deploy/backup.py", "--keep-days", "30"]
    volumes:
      - ./data:/app/data
    environment:
      - MANTIS_DATA_DIR=/app/data
      - MANTIS_BACKUP_DIR=/app/data/backups
      - MANTIS_LOG_DIR=/app/data/logs
    restart: unless-stopped
    # Ejecuta backup cada hora usando sleep (alternativa simple a cron dentro del contenedor)
    command: >
      sh -c "while true; do python3 /app/goals/mcp-deploy/backup.py --keep-days 30; sleep 3600; done"
