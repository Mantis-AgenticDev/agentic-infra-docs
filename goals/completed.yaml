**Atributos exclusivos de `completed.yaml`**:

| Campo | Propósito |
|-------|-----------|
| `completed_at` | Timestamp exacto de cuándo se marcó `complete`. |
| `completion_audit_hash` | Hash criptográfico que vincula la evidencia de que el objetivo se cumplió (archivos generados, resultados de tests, etc.). Esto permite auditorías forenses. |
| `metrics` | Snapshot final de las métricas OTel para alimentar Loki/Grafana sin necesidad de recálculo. |

**Reglas de inmutabilidad**:
- Las entradas se agregan al final de `completed:`.
- No se modifica ni se borra ninguna entrada existente.
- Cualquier corrección se registra como una nueva entrada con `completion_audit_hash` distinto.

