# Publica automáticamente la imagen Docker en Docker Hub al pushear a main.

name: Publish Docker Image to Docker Hub

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:  # Permite ejecución manual desde la UI de GitHub

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: goals/mcp-deploy/Dockerfile
          push: true
          tags: mantisagenticdev/mantis-goals:latest
