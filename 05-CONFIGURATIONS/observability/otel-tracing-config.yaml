# OPENTELEMETRY COLLECTOR CONFIG (MANTIS v2.0.0)
# Propósito: Trazabilidad distribuida, métricas de latencia (V3), enmascaramiento de secrets (C3)
# Generado por: configurations-master-agent
# Fecha: 2026-04-30
# Alineación: interface-spec.yaml, mapping.yaml, health-check.sh

receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  memory_limiter:
    check_interval: 5s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch:
    timeout: 10s
    send_batch_size: 1000
  probabilistic_sampler:
    hash_seed: 22
    sampling_percentage: ${SAMPLING_RATE:-10} # Dev: 100, Staging: 50, Prod: 10
  attributes:
    actions:
      - key: deployment.environment
        from_attribute: ENVIRONMENT_TAG
        action: insert
      - key: project.name
        value: mantis-agentic
        action: insert
      # C3: Enmascaramiento explícito de headers/attributes sensibles
      - key: http.request.header.authorization
        action: delete
      - key: http.request.header.api-key
        action: delete
      - key: db.statement
        action: update
        value: "[SANITIZED_QUERY]"
        condition: 'attributes["db.statement"] contains "password"'

exporters:
  otlphttp/traces:
    endpoint: ${TEMPO_ENDPOINT:-http://tempo:3200}
  prometheusremotewrite/metrics:
    endpoint: ${PROMETHEUS_REMOTE_WRITE_URL:-http://prometheus:9090/api/v1/write}
    resource_to_telemetry_conversion:
      enabled: true
  logging/debug:
    verbosity: basic
    sampling_initial: 5
    sampling_thereafter: 100

service:
  telemetry:
    logs: { level: info }
    metrics: { address: 0.0.0.0:8888 }
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, probabilistic_sampler, attributes, batch]
      exporters: [otlphttp/traces, logging/debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes, batch]
      exporters: [prometheusremotewrite/metrics]

# [CONSTRAINT_MAPPING]
# C4: resource.attributes garantizan correlación cross-service y dashboards consistentes
# C3: attributes processor elimina/mascara headers sensibles y queries con passwords antes de exportar
# C8: métricas expuestas en :8888 para Prometheus scraping; thresholds alineados a interface-spec.yaml
# V3: spans de qdrant/pgvector deben inyectar `vector.search.latency` y `db.statement` sanitizado

# [VALIDATION_RULES]
# - YAML sintaxis válido y compatible con otelcol v0.95+
# - `sampling_percentage` debe estar entre 1 y 100
# - `memory_limiter.limit_percentage` < 90 (prevención OOM)
# - Ningún `exporter` apunta a endpoints públicos sin TLS implícito
# - Pipelines `traces` y `metrics` deben contener al menos 1 receiver y 1 exporter

# [ANTI-PATTERNS]
# ❌ NUNCA: `sampling_percentage: 100` en producción (sobrecarga de almacenamiento, viola C8)
# ❌ NUNCA: Exponer `Authorization`, `api-key` o `db.password` en traces/logs (viola C3 críticamente)
# ❌ NUNCA: Omitir `memory_limiter` (riesgo de OOM en collector bajo carga pico)
# ✅ SIEMPRE: Alinear `deployment.environment` con `ENVIRONMENT_TAG` de mapping.yaml
# ✅ SIEMPRE: Validar config con `otelcol --config <file> --dry-run` pre-deploy
# ✅ SIEMPRE: Inyectar `vector.search.latency` en spans de Qdrant/pgvector (V3)

# [VALIDATION_COMMANDS]
