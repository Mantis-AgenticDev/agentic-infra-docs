# ============================================================================
# ANTI-PATRONES EXPLÍCITOS (C4, C5, C8, V3)
# ============================================================================
# ❌ NUNCA: `scrape_interval < 5s` en producción (overhead de I/O y CPU, viola C8 estabilidad)
# ❌ NUNCA: Exponer `basic_auth`, `bearer_token` o credenciales TLS inline (viola C3)
# ❌ NUNCA: Omitir `evaluation_interval` o dejarlo >60s (retraso en evaluación de alertas, viola C8/V2)
# ❌ NUNCA: Hardcodear IPs estáticas en `targets`; usar DNS interno de Docker/VPC o service discovery
# ✅ SIEMPRE: Alinear `job_name` con labels de `otel-tracing-config.yaml` para correlación cross-signal
# ✅ SIEMPRE: Validar sintaxis con `promtool check config` pre-deploy (C5)
# ✅ SIEMPRE: Mantener `external_labels` consistentes para agregación multi-entorno (C4)

