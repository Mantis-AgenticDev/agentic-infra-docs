# =============================================================================
# PROVIDER ROUTER CONFIGURATION — MANTIS AGENTIC ECOSYSTEM v2.0.0
# =============================================================================
# Propósito: Definir reglas de enrutamiento para selección dinámica de 
#            proveedores Cloud (AWS, GCP, Azure) basado en perfil de infra 
#            y región. Integración estricta con OIDC (C3: Cero Secrets).
# Versión: 1.0.0-COMPREHENSIVE | Estado: READY_FOR_DEPLOY
# =============================================================================

router_version: "1.0.0"
last_updated: "2026-05-01T00:00:00Z"
owner: "pipelines-master-agent"
validation_schema: "https://mantis-agentic.dev/schemas/provider-router-v1.0.0.json"

# =============================================================================
# SECCIÓN 1: MATRIZ DE ENRUTAMIENTO (Profile -> Provider)
# =============================================================================
# Define qué proveedor es elegible para cada perfil de infraestructura.
# Prioridad: El primer "provider" en la lista que cumpla las condiciones se usa.
# =============================================================================

routing_matrix:
  # Perfil Nano/Micro: Optimizado para costos y rapidez (Spot Instances / Serverless)
  low_tier:
    profiles: ["nano", "micro"]
    default_provider: "aws"
    fallback_providers: ["gcp", "azure"]
    constraints:
      max_region_latency_ms: 150
      required_features: ["oidc", "spot_instances", "container_registry"]
    oidc_config:
      aws:
        role_pattern: "arn:aws:iam::{account_id}:role/mantis-ci-cd-{environment}"
        audience: "sts.amazonaws.com"
        duration_seconds: 3600
      gcp:
        service_account_pattern: "mantis-ci-cd-{environment}@{project_id}.iam.gserviceaccount.com"
        audience: "https://accounts.google.com"
        workload_provider: "projects/{project_number}/locations/global/workloadIdentityPools/mantis-pool"

  # Perfil Standard: Balanceado. Soporte multi-nodo y bases de datos gestionadas
  mid_tier:
    profiles: ["standard"]
    default_provider: "aws"
    fallback_providers: ["azure"]
    constraints:
      max_region_latency_ms: 100
      required_features: ["ha_db", "managed_kubernetes", "oidc"]
    oidc_config:
      aws:
        role_pattern: "arn:aws:iam::{account_id}:role/mantis-std-{environment}"
        audience: "sts.amazonaws.com"
      azure:
        client_id_pattern: "{client-id-guid}"
        tenant_id: "{tenant-id-guid}"
        subscription_id: "{sub-id-guid}"
        audience: "api://AzureADTokenExchange"

  # Perfil Large: Enterprise. Alto rendimiento, bare metal o instancias dedicadas
  high_tier:
    profiles: ["large"]
    default_provider: "aws" # Preferencia por AWS Graviton/Intel
    fallback_providers: ["gcp"]
    constraints:
      max_region_latency_ms: 50
      required_features: ["dedicated_hosts", "cross_region_backup", "oidc"]
    oidc_config:
      aws:
        role_pattern: "arn:aws:iam::{account_id}:role/mantis-ent-{environment}"
        audience: "sts.amazonaws.com"
        duration_seconds: 7200 # Sesiones más largas para despliegues masivos

# =============================================================================
# SECCIÓN 2: MAPEO DE REGIONES Y DISPONIBILIDAD
# =============================================================================
# Reglas para restringir o permitir regiones según cumplimiento de datos (C6).
# =============================================================================

region_rules:
  # Regiones restringidas para datos sensibles (C6 Compliance)
  restricted_regions: ["cn-north-1", "us-gov-east-1"] # Solo si hay autorización explícita
  blocked_regions: []

  # Mapeo de alias internos a nombres técnicos de proveedor
  region_aliases:
    "sa-east-1":
      aws: "South America (São Paulo)"
      gcp: "southamerica-east1"
      azure: "Brazil South"
    "us-east-1":
      aws: "US East (N. Virginia)"
      gcp: "us-east4"
      azure: "East US"
    "eu-central-1":
      aws: "Europe (Frankfurt)"
      gcp: "europe-west3"
      azure: "Germany West Central"

  # Latencia estimada para fallback automático (ms)
  latency_map:
    "sa-east-1": { aws: 80, gcp: 120, azure: 150 }
    "us-east-1": { aws: 40, gcp: 45, azure: 50 }
    "eu-central-1": { aws: 35, gcp: 30, azure: 40 }

# =============================================================================
# SECCIÓN 3: RESOLUCIÓN DE CREDENCIALES OIDC (C3 - Cero Secrets)
# =============================================================================
# Estructura para inyección segura de tokens en tiempo de ejecución.
# =============================================================================

oidc_injection_rules:
  # Variable de entorno donde el pipeline espera el token
  token_env_var: "OIDC_TOKEN"
  
  # Mapeo de variables de entorno específicas del proveedor
  provider_env_vars:
    aws:
      AWS_DEFAULT_REGION: "AWS_REGION"
      AWS_ACCOUNT_ID: "AWS_ACCOUNT_ID"
      ROLE_ARN: "AWS_ROLE_ARN"
      WEB_IDENTITY_TOKEN_FILE: "/var/run/secrets/oidc-token"
    
    gcp:
      GOOGLE_PROJECT: "GCP_PROJECT_ID"
      GOOGLE_REGION: "GCP_REGION"
      GOOGLE_SERVICE_ACCOUNT: "GCP_SA_EMAIL"
      GOOGLE_APPLICATION_CREDENTIALS: "/var/run/secrets/gcp-creds.json"
    
    azure:
      AZURE_SUBSCRIPTION_ID: "AZURE_SUBSCRIPTION_ID"
      AZURE_TENANT_ID: "AZURE_TENANT_ID"
      AZURE_CLIENT_ID: "AZURE_CLIENT_ID"
      AZURE_AUTHORITY_HOST: "https://login.microsoftonline.com"

# =============================================================================
# SECCIÓN 4: ESTRATEGIAS DE FALLBACK Y RESILIENCIA (C7)
# =============================================================================
# Qué hacer si el proveedor principal falla o no está disponible.
# =============================================================================

fallback_strategies:
  on_oidc_failure:
    action: "retry"
    max_retries: 3
    backoff_seconds: [10, 30, 60]
    notification_channel: "#ops-alerts"
  
  on_provider_quota_exceeded:
    action: "switch_to_fallback"
    fallback_priority: 1 # Índice en fallback_providers
    notify_owner: true
  
  on_region_unavailable:
    action: "nearest_region_failover"
    metric: "latency_map"
    max_latency_increase_percent: 20 # Aceptar hasta 20% más de latencia

# =============================================================================
# SECCIÓN 5: VALIDACIÓN AUTOMÁTICA (C5)
# =============================================================================
# Script para validar que la configuración es coherente antes de usarla.
# =============================================================================

self_validation:
  commands:
    - name: "Validar sintaxis YAML"
      command: "yq eval '.' 05-CONFIGURATIONS/pipelines/provider-router.yml > /dev/null"
    
    - name: "Verificar consistencia de regiones"
      command: |
        # Verificar que todas las regiones en routing_matrix existen en region_rules
        yq '.routing_matrix | .. | select(has("max_region_latency_ms"))' 05-CONFIGURATIONS/pipelines/provider-router.yml
        # (Lógica simplificada para validación manual o script)

    - name: "Validar estructura OIDC"
      command: |
        yq '.oidc_config | keys' 05-CONFIGURATIONS/pipelines/provider-router.yml
        # Asegurar que aws, gcp, azure tienen estructura consistente

# =============================================================================
# ANTI-PATRONES (DO NOT)
# =============================================================================
anti_patterns:
  - violation: "Hardcodear Access Keys o Secret Keys en este archivo"
    correction: "Usar siempre role_pattern y audience para OIDC"
  - violation: "Definir proveedores sin fallback"
    correction: "Siempre incluir fallback_providers para C7"
  - violation: "Regiones sin alias o latencia"
    correction: "Actualizar region_aliases y latency_map"

# =============================================================================
# METADATOS DE TRAZABILIDAD
# =============================================================================
traceability:
  changelog: "05-CONFIGURATIONS/docs/CHANGELOG.md"
  audit_log: "08-LOGS/provider-routing-audit/"


