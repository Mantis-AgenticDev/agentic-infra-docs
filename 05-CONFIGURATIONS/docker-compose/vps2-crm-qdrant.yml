# VPS2 STACK: CRM API + Qdrant (Vector Search) (MANTIS v2.0.0)
# Propósito: Backend CRM con búsqueda vectorial escalable, aislamiento de red y gestión segura de credenciales.
# Generado por: docker-compose-master-agent
# Fecha: 2026-04-30
# Alineación: interface-spec.yaml §2, mapping.yaml, qdrant-cluster/main.tf, vps-base/main.tf
version: "3.8"

services:
  # --- CRM API BACKEND ---
  crm-api:
    image: ${CRM_API_IMAGE:-mantis/crm-api:latest}
    container_name: mantis-crm-api-vps2
    restart: unless-stopped # C7: resiliencia automática
    ports:
      - "${CRM_API_PORT:-8080}:8080"
    environment:
      - NODE_ENV=${ENVIRONMENT_TAG}
      - DATABASE_URL_FILE=/run/secrets/db_url # C3: inyección segura
      - QDRANT_ENDPOINT=${QDRANT_ENDPOINT:-http://qdrant:6333}
      - QDRANT_API_KEY_FILE=/run/secrets/qdrant_key
      - JWT_SECRET_FILE=/run/secrets/jwt_secret
    secrets:
      - db_url
      - qdrant_key
      - jwt_secret
    healthcheck: # C8: validación de readiness
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 3G }
        reservations: { cpus: "0.5", memory: 1G }
    logging:
      driver: "json-file"
      options: { max-size: "30m", max-file: "4", tag: "crm-api/{{.ID}}" } # C4: trazabilidad
    networks: { mantis-net: {}, db-net: {}, vector-net: {} }
    labels:
      com.mantis.domain: "05-CONFIGURATIONS"
      com.mantis.environment: "${ENVIRONMENT_TAG}"
      com.mantis.constraint: "V3-vector-ready,C8-health,C3-secrets"

  # --- QDRANT VECTOR DATABASE ---
  qdrant:
    image: qdrant/qdrant:latest # Pin version en CI/CD real (C1)
    container_name: mantis-qdrant-vps2
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__API_KEY_FILE=/run/secrets/qdrant_key
      - QDRANT__TELEMETRY_DISABLED=true # C8: métricas vía OTel, no telemetría externa
    secrets:
      - qdrant_key
    volumes:
      - qdrant_data:/qdrant/storage # Persistencia de índices vectoriales (V3)
    healthcheck: # C8/V3: validación de engine
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "3.0", memory: 6G } # V3: Qdrant requiere memoria para HNSW
        reservations: { cpus: "1.0", memory: 2G }
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5" }
    networks: { vector-net: {}, mantis-net: {} }
    labels:
      com.mantis.domain: "05-CONFIGURATIONS"
      com.mantis.constraint: "V3-hnsw-optimized,C3-api-key-secure"

networks:
  mantis-net:
    driver: bridge
    name: mantis-vps2-overlay
    ipam: { config: [{ subnet: 172.22.0.0/16 }] }
  db-net:
    driver: bridge
    internal: true # V1/C3: aislamiento capa datos
    name: mantis-vps2-db
  vector-net:
    driver: bridge
    internal: true # V3/C3: aislamiento capa vectorial
    name: mantis-vps2-vector

secrets:
  db_url:
    file: ./secrets/db_url.txt
  qdrant_key:
    file: ./secrets/qdrant_key.txt
  jwt_secret:
    file: ./secrets/jwt_secret.txt

volumes:
  qdrant_data:
    driver: local
    driver_opts: { type: "none", device: "/mnt/qdrant-data", o: "bind" } # Montaje host para performance I/O

# ============================================================================
# ANTI-PATRONES EXPLÍCITOS (C1, C3, V1, V3)
# ============================================================================
# ❌ NUNCA: Exponer puertos 6333/6334 a 0.0.0.0 sin firewall (viola C3/V1)
# ❌ NUNCA: Usar `environment: QDRANT__SERVICE__API_KEY=sk-...` en compose (viola C3)
# ❌ NUNCA: Omitir `start_period` en Qdrant (viola C8: carga de índices es lenta)
# ❌ NUNCA: Desactivar `internal: true` en `vector-net` o `db-net` sin ADR
# ✅ SIEMPRE: Alinear `limits.memory` con tamaño de dataset para evitar OOM en HNSW (V3)
# ✅ SIEMPRE: Montar volumen en disco de alta IOPS para `qdrant_data` (V3 performance)

