# VPS1 STACK: n8n + UAZ API (Producción Principal - MANTIS v2.0.0)
# Propósito: Orquestación de servicios core con aislamiento de red, inyección segura de secrets y health checks profundos.
# Generado por: docker-compose-master-agent
# Fecha: 2026-04-30
# Alineación: interface-spec.yaml §2, mapping.yaml, vps-base/main.tf
version: "3.8"

services:
  # --- n8n WORKFLOW AUTOMATION ---
  n8n:
    image: n8nio/n8n:1.42.0 # Pin version (C1/C2)
    container_name: mantis-n8n-vps1
    restart: unless-stopped # C7: resiliencia automática sin loops infinitos
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - GENERIC_TIMEZONE=${TIMEZONE:-America/Sao_Paulo}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE:-true}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${DB_HOST:?missing}
      - DB_POSTGRESDB_PORT=${DB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=n8n_vps1
      - DB_POSTGRESDB_USER=n8n_app
      - DB_POSTGRESDB_PASSWORD_FILE=/run/secrets/n8n_db_pass # C3: file injection
    secrets:
      - n8n_db_pass
    healthcheck: # C8: deep health check
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G } # C8: límites explícitos (perfil standard)
        reservations: { cpus: "0.5", memory: 1G }
    logging:
      driver: "json-file"
      options: { max-size: "50m", max-file: "5", tag: "{{.Name}}/{{.ID}}" } # C4: trazabilidad de logs
    networks: { mantis-net: {}, db-net: {} }
    labels:
      com.mantis.domain: "05-CONFIGURATIONS"
      com.mantis.environment: "${ENVIRONMENT_TAG}"
      com.mantis.constraint: "C8-health,C7-resilience,V1-isolation"

  # --- UAZ API SERVICE ---
  uaz-api:
    image: ${UAZ_API_IMAGE:-mantis/uaz-api:latest}
    container_name: mantis-uaz-api-vps1
    restart: unless-stopped
    ports:
      - "${API_PORT:-4000}:4000"
    environment:
      - NODE_ENV=${ENVIRONMENT_TAG}
      - DATABASE_URL_FILE=/run/secrets/db_url # C3: connection string segura
      - QDRANT_ENDPOINT=${QDRANT_ENDPOINT:-http://qdrant:6333}
      - QDRANT_API_KEY_FILE=/run/secrets/qdrant_key
    secrets:
      - db_url
      - qdrant_key
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:4000/health/ready', (r) => process.exit(r.statusCode === 200 ? 0 : 1))\""]
      interval: 20s
      timeout: 5s
      retries: 4
      start_period: 30s
    deploy:
      resources:
        limits: { cpus: "1.5", memory: 2G }
        reservations: { cpus: "0.25", memory: 512M }
    logging:
      driver: "json-file"
      options: { max-size: "20m", max-file: "3" }
    networks: { mantis-net: {}, db-net: {} }
    depends_on:
      n8n: { condition: service_healthy } # C7: startup ordenado validado por health

networks:
  mantis-net:
    driver: bridge
    name: mantis-vps1-overlay
    ipam: { config: [{ subnet: 172.20.0.0/16 }] }
  db-net:
    driver: bridge
    internal: true # V1/C3: aislamiento lógico de capa de datos (sin exposición externa)
    name: mantis-vps1-db

secrets:
  n8n_db_pass:
    file: ./secrets/n8n_db_pass.txt # Placeholder; CI/CD inyecta via Docker Secrets o Swarm
  db_url:
    file: ./secrets/db_url.txt
  qdrant_key:
    file: ./secrets/qdrant_key.txt

# ============================================================================
# ANTI-PATRONES EXPLÍCITOS (C1, C3, C7, C8)
# ============================================================================
# ❌ NUNCA: `environment: - DB_PASSWORD=123456` (viola C3 críticamente)
# ❌ NUNCA: Omitir `healthcheck` o `start_period` en servicios con init costoso
# ❌ NUNCA: `internal: false` en `db-net` (expone DB a red externa, viola V1/C3)
# ❌ NUNCA: Usar `restart: always` sin `deploy.resources.limits` (viola C8/estabilidad)
# ✅ SIEMPRE: Inyectar secrets vía `secrets:` block o vault en CI/CD
# ✅ SIEMPRE: Alinear `${VAR}` con `mapping.yaml` e `interface-spec.yaml`

