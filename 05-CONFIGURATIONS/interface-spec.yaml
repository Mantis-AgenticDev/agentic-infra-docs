# =============================================================================
# ESPECIFICAÇÃO DE INTERFACE — ECOSSISTEMA MANTIS AGENTIC v2.3.0
# Contrato explícito: Terraform ↔ Docker Compose ↔ Pipelines ↔ CEO
# =============================================================================
# Propósito: Fonte única de verdade para nomes de variáveis, outputs, 
#            tipos de dados e validação cruzada entre domínios.
# Versão: 2.3.0 | Estado: READY_FOR_DEPLOY
# Constraints aplicáveis: C2 (IaC), C4 (Rastreabilidade), C5 (Integridade), V1 (Isolamento de Tenant)
# =============================================================================

spec_version: "2.3.0"
last_updated: "2026-05-24T10:00:00Z"
owner: "configurations-ceo"
language_lock: ["yaml", "json-schema", "hcl-reference"]

# =============================================================================
# SEÇÃO 1: VARIÁVEIS GLOBAIS (Cross-Domain)
# =============================================================================
# Estas variáveis devem estar definidas em mapping.yaml e disponíveis em:
# - Terraform: como variáveis de entrada (variables.tf)
# - Docker Compose: como environment ou secrets
# - Agents: como contexto de execução resolvido por 00-STACK-SELECTOR.md
# =============================================================================

global_variables:
  environment:
    type: string
    enum: ["dev", "staging", "prod"]
    required: true
    description: "Ambiente de despliegue. Define comportamento de secrets, métricas e gates de aprovação."
    constraints: ["C4"]
    terraform_var: "var.environment"
    docker_env: "ENVIRONMENT"
    agent_context: "{environment}"

  tenant_id:
    type: string
    pattern: "^[a-z0-9-]{3,32}$"
    required: true
    description: "Identificador único de tenant para isolamento RLS e roteamento de agentes."
    constraints: ["V1", "C4"]
    terraform_var: "var.tenant_id"
    docker_env: "TENANT_ID"
    agent_context: "{tenant_id}"
    validation_sql: "SELECT current_setting('app.tenant_id', true) = '{{tenant_id}}'"

  infra_profile:
    type: string
    enum: ["nano", "micro", "standard", "large"]
    default: "nano"
    description: "Perfil de recursos para VPS. Afeta CPU/RAM/Storage no Terraform e limits no Docker."
    constraints: ["C2", "C5"]
    terraform_var: "var.infra_profile"
    docker_env: "INFRA_PROFILE"
    agent_context: "{infra_profile}"
    resource_mapping:
      nano: { cpus: "0.5", memory: "4G", storage: "50G" }
      micro: { cpus: "1.0", memory: "8G", storage: "100G" }
      standard: { cpus: "2.0", memory: "16G", storage: "200G" }
      large: { cpus: "4.0", memory: "32G", storage: "400G" }

  secrets_backend:
    type: string
    enum: ["vault", "aws-ssm", "dotenv-placeholder"]
    default: "dotenv-placeholder"
    description: "Backend para gestão de secrets. Em dev: placeholders; em prod: Vault/SSM."
    constraints: ["C3", "C6"]
    terraform_var: "var.secrets_backend"
    docker_env: "SECRETS_BACKEND"
    agent_context: "{secrets_backend}"

  observability_enabled:
    type: boolean
    default: true
    description: "Habilita scraping Prometheus, tracing OTel e dashboards Grafana."
    constraints: ["C4", "C8"]
    terraform_var: "var.observability_enabled"
    docker_env: "OBSERVABILITY_ENABLED"
    agent_context: "{observability_enabled}"

# =============================================================================
# SEÇÃO 2: OUTPUTS DE TERRAFORM → INPUTS DE DOCKER COMPOSE
# =============================================================================
# Mapeamento explícito: cada output de Terraform deve ter um consumidor definido
# em Docker Compose. Validação cruzada com orchestrator-engine.sh.
# =============================================================================

terraform_to_docker:
  postgres:
    terraform_module: "modules/postgres-rls"
    outputs:
      db_host:
        type: string
        format: hostname
        description: "Endpoint de conexão ao PostgreSQL"
        docker_inject_as: "POSTGRES_HOST"
        validation_regex: "^[a-z0-9.-]+\\.amazonaws\\.com$|^[0-9.]+$"
      
      db_port:
        type: integer
        default: 5432
        docker_inject_as: "POSTGRES_PORT"
        validation_range: { min: 1, max: 65535 }
      
      db_name:
        type: string
        docker_inject_as: "POSTGRES_DB"
        validation_regex: "^[a-z][a-z0-9_]*$"
      
      db_user:
        type: string
        docker_inject_as: "POSTGRES_USER"
        constraints: ["C3"]
      
      db_password:
        type: secret
        docker_inject_as: "POSTGRES_PASSWORD"
        source: "${secrets_backend}"
        constraints: ["C3", "C6"]
        mount_as_file: true
      
      rls_enabled:
        type: boolean
        default: true
        docker_inject_as: "POSTGRES_RLS_ENABLED"
        constraints: ["V1"]
      
      tenant_schema:
        type: string
        description: "Nome do esquema RLS por tenant"
        docker_inject_as: "TENANT_SCHEMA"
        constraints: ["V1"]
        validation_sql: "SELECT schema_name FROM information_schema.schemata WHERE schema_name = 'tenant_{{tenant_id}}'"
    
    docker_compose_mapping:
      service: "postgres-rls"
      environment_block: true
      secrets_block: true
      healthcheck_dependency: true
      network: "backend"

  qdrant:
    terraform_module: "modules/qdrant-cluster"
    outputs:
      qdrant_host:
        type: string
        format: hostname
        docker_inject_as: "QDRANT_HOST"
      
      qdrant_port:
        type: integer
        default: 6333
        docker_inject_as: "QDRANT_PORT"
      
      qdrant_api_key:
        type: secret
        docker_inject_as: "QDRANT_API_KEY"
        source: "${secrets_backend}"
        constraints: ["C3", "C6"]
        mount_as_file: true
      
      vector_dimension:
        type: integer
        description: "Dimensão de embeddings (V1: deve ser declarada explicitamente)"
        default: 1536
        docker_inject_as: "VECTOR_DIMENSION"
        constraints: ["V1"]
        validation_range: { min: 128, max: 16000 }
      
      vector_index_type:
        type: string
        enum: ["hnsw", "ivfflat"]
        default: "hnsw"
        docker_inject_as: "VECTOR_INDEX_TYPE"
        constraints: ["V3"]
        comment_required: "Justificar parâmetros m, ef_construction no HCL"
      
      vector_distance_metric:
        type: string
        enum: ["cosine", "euclidean", "dot"]
        default: "cosine"
        docker_inject_as: "VECTOR_DISTANCE_METRIC"
        constraints: ["V2"]
        sql_operator_mapping:
          cosine: "<=>"
          euclidean: "<->"
          dot: "<#>"
    
    docker_compose_mapping:
      service: "qdrant-vector"
      environment_block: true
      secrets_block: true
      healthcheck_dependency: true
      network: "backend"
      resources:
        nano: { memory: "1G", cpus: "0.5" }
        micro: { memory: "2G", cpus: "1.0" }
        standard: { memory: "4G", cpus: "2.0" }
        large: { memory: "8G", cpus: "4.0" }

  networking:
    terraform_module: "modules/vpc-base"
    outputs:
      vpc_id:
        type: string
        format: "vpc-[a-z0-9]+"
        docker_inject_as: "VPC_ID"
        constraints: ["C2"]
      
      private_subnet_ids:
        type: array
        items: { type: string, format: "subnet-[a-z0-9]+" }
        min_items: 2
        docker_inject_as: "PRIVATE_SUBNET_IDS"
        constraints: ["C2"]
      
      security_group_id:
        type: string
        format: "sg-[a-z0-9]+"
        docker_inject_as: "SECURITY_GROUP_ID"
        constraints: ["C2"]
    
    docker_compose_mapping:
      network_driver: "bridge"
      internal_network: true
      external_network_ref: "${vpc_id}"

# =============================================================================
# SEÇÃO 3: PROTOCOLO DE COMUNICAÇÃO AGENT ↔ AGENT
# =============================================================================
# Definição de como os agentes mestres se comunicam entre si mediante
# Task() com rotas canônicas, sem passar conteúdos de arquivos.
# =============================================================================

agent_communication_protocol:
  task_format:
    required_fields:
      - subagent_type: "ID do agente mestre destino (ex: terraform-master-agent)"
      - prompt: "Instrução específica com referências a arquivos canônicos"
      - context: "Array de rotas canônicas a insumos (nunca conteúdos)"
      - expected_output: "Array de rotas canônicas a outputs esperados"
      - validation_command: "Comando de validação pós-execução"
      - timeout_minutes: "Timeout para evitar jobs travados"
    
    optional_fields:
      - depends_on: "Array de tarefas prévias que devem ser concluídas"
      - retry_policy: "Configuração de re-tentativas com backoff"
      - audit_flags: "Flags de auditoria a registrar na chronique"

  example_delegation_terraform_to_compose:
    task:
      subagent_type: "docker-compose-master-agent"
      prompt: "Gerar compose.yaml para ambiente ${environment} usando outputs de Terraform"
      context:
        - "05-CONFIGURATIONS/terraform/envs/${environment}/outputs.json"
        - "05-CONFIGURATIONS/interface-spec.yaml"
        - "00-STACK-SELECTOR.md"
      expected_output:
        - "05-CONFIGURATIONS/docker-compose/compose.${environment}.yaml"
        - "05-CONFIGURATIONS/docker-compose/.env.${environment}"
      validation_command: "docker compose -f compose.yaml -f compose.${environment}.yaml config --quiet"
      timeout_minutes: 15
    constraints_enforced:
      - "C2: Outputs do Terraform devem coincidir com inputs do Compose"
      - "C4: Rotas canônicas, não conteúdos, no contexto"
      - "C5: validation_command obrigatório no frontmatter do output"
      - "V1: tenant_id deve ser propagado através de toda a cadeia"

  example_delegation_pgvector_query:
    task:
      subagent_type: "postgresql-pgvector-rag-master-agent"
      prompt: "Gerar consulta de busca vetorial para tenant ${tenant_id} com dimensão ${vector_dimension}"
      context:
        - "05-CONFIGURATIONS/interface-spec.yaml"
        - "02-SKILLS/BASE DE DATOS-RAG/rag-master-agent.md"
        - "00-STACK-SELECTOR.md"
      expected_output:
        - "02-SKILLS/BASE DE DATOS-RAG/queries/tenant_${tenant_id}_search.sql"
      validation_command: "bash 05-CONFIGURATIONS/validation/verify-constraints.sh --check-vector-dims --file {output}"
      timeout_minutes: 5
    language_lock_enforcement:
      allowed_operators: ["<->", "<=>", "<#>", "vector(n)", "USING hnsw", "USING ivfflat"]
      denied_in_other_agents: true
      violation_action: "BLOCKING: LANGUAGE_LOCK_VIOLATION + suggest_pgvector_domain"
    tenant_isolation_v1:
      required_clause: "WHERE tenant_id = current_setting('app.tenant_id')"
      rls_policy_check: "EXPLAIN ANALYZE deve mostrar Filter: (tenant_id = ...)"
      forbidden_cross_tenant: "Nenhuma consulta pode acessar dados de outro tenant_id"

# =============================================================================
# SEÇÃO 4: VALIDAÇÃO CRUZADA AUTOMATIZADA
# =============================================================================
# Comandos e scripts para validar que as interfaces são cumpridas em runtime.
# Executar como parte de integrity-check.yml no CI/CD.
# =============================================================================

cross_validation_commands:
  terraform_docker_consistency:
    command: |
      terraform output -json > /tmp/tf-outputs.json
      yq '.terraform_to_docker | .. | select(has("docker_inject_as")) | .docker_inject_as' interface-spec.yaml | sort > /tmp/expected-vars.txt
      for var in $(cat /tmp/expected-vars.txt); do
        if ! jq -e --arg v "$var" '.. | select(. == $v)' /tmp/tf-outputs.json >/dev/null 2>&1; then
          echo "❌ Variável $var não encontrada nos outputs de Terraform"
          exit 1
        fi
      done
      echo "✅ Consistência Terraform→Docker verificada"
    constraints: ["C2", "C5"]

  language_lock_validation:
    command: |
      for file in $(find 02-SKILLS -name '*.md' ! -path '*/BASE DE DATOS-RAG/*'); do
        if grep -qE '<->|<=>|<#>|vector\(|USING (hnsw|ivfflat)' "$file"; then
          echo "❌ LANGUAGE_LOCK VIOLATION: Operador pgvector em $file"
          echo "   Operadores vetoriais só são permitidos em: 02-SKILLS/BASE DE DATOS-RAG/"
          exit 1
        fi
      done
      echo "✅ LANGUAGE_LOCK para pgvector verificado"
    constraints: ["V1", "V2", "V3"]

  tenant_isolation_validation:
    command: |
      for query in $(find 02-SKILLS -name '*.sql'); do
        if ! grep -q "WHERE.*tenant_id" "$query" && ! grep -q "RLS policy" "$query"; then
          echo "⚠️  Consulta $query não inclui isolamento de tenant (V1)"
          echo "   Adicionar: WHERE tenant_id = current_setting('app.tenant_id')"
        fi
      done
      echo "✅ Revisão de isolamento de tenant concluída"
    constraints: ["V1"]

# =============================================================================
# SEÇÃO 5: SCHEMA JSON PARA VALIDAÇÃO AUTOMÁTICA
# =============================================================================

interface_schema:
  $schema: "https://json-schema.org/draft/2020-12/schema"
  $id: "https://mantis-agentic.dev/schemas/interface-spec-v2.3.0.json"
  title: "MANTIS Interface Specification"
  description: "Contrato explícito entre Terraform, Docker Compose e Agents"
  type: object
  required: ["spec_version", "global_variables", "terraform_to_docker", "agent_communication_protocol"]
  properties:
    spec_version:
      type: string
      pattern: "^\\d+\\.\\d+\\.\\d+(-[A-Z]+)?$"
    global_variables:
      type: object
      additionalProperties:
        type: object
        required: ["type", "description"]
        properties:
          type: { enum: ["string", "integer", "boolean", "secret", "array"] }
          enum: { type: array }
          pattern: { type: string, format: "regex" }
          required: { type: boolean }
          constraints: { type: array, items: { enum: ["C1","C2","C3","C4","C5","C6","C7","C8","V1","V2","V3"] } }
          terraform_var: { type: string }
          docker_env: { type: string }
          agent_context: { type: string }
    terraform_to_docker:
      type: object
      additionalProperties:
        type: object
        required: ["terraform_module", "outputs"]
        properties:
          outputs:
            type: object
            additionalProperties:
              type: object
              required: ["type", "docker_inject_as"]
              properties:
                type: { enum: ["string", "integer", "boolean", "secret", "array"] }
                docker_inject_as: { type: string, pattern: "^[A-Z_][A-Z0-9_]*$" }
                constraints: { type: array }
                validation_regex: { type: string, format: "regex" }
                validation_range: { type: object, properties: { min: { type: number }, max: { type: number } } }
    agent_communication_protocol:
      type: object
      required: ["task_format", "example_delegation_terraform_to_compose"]
  additionalProperties: false

# =============================================================================
# SEÇÃO 6: ANTI-PADRÕES EXPLÍCITOS (NÃO FAÇA)
# =============================================================================

anti_patterns:
  - violation: "Hardcodear valores de infra no Docker Compose"
    example: 'memory: "2G"  # ← Valor fixo'
    correction: 'memory: "${INFRA_PROFILE_MEMORY}"  # ← Variável resolvida pelo mapping.yaml'
    constraints: ["C2", "C5"]
  
  - violation: "Passar conteúdos de arquivos em Task() em vez de rotas"
    example: 'context: ["<file_content>...</file_content>"]'
    correction: 'context: ["05-CONFIGURATIONS/terraform/envs/prod/outputs.json"]'
    constraints: ["C4", "C8"]
  
  - violation: "Usar operadores pgvector em agentes não-pgvector"
    example: 'SELECT * FROM docs ORDER BY embedding <=> $1  # ← Em agente bash'
    correction: 'Delegar a postgresql-pgvector-rag-master-agent com Task()'
    constraints: ["V1", "LANGUAGE_LOCK"]
  
  - violation: "Omitir validation_command no frontmatter de outputs"
    example: '# Sem validation_command'
    correction: 'validation_command: "bash 05-CONFIGURATIONS/validation/orchestrator-engine.sh --strict"'
    constraints: ["C5"]
  
  - violation: "Secrets em variáveis de ambiente em vez de arquivos montados"
    example: 'environment: ["DB_PASSWORD=secret123"]'
    correction: 'secrets: ["db_password"] + environment: ["DB_PASSWORD_FILE=/run/secrets/db_password"]'
    constraints: ["C3", "C6"]

# =============================================================================
# SEÇÃO 7: METADADOS DE RASTREABILIDADE (C4)
# =============================================================================

traceability:
  versioning:
    major: "Mudanças incompatíveis em nomes/tipos de variáveis"
    minor: "Novas variáveis ou outputs adicionados (backward-compatible)"
    patch: "Correções de documentação ou exemplos (sem mudanças de interface)"

  changelog_integration:
    commit_convention: "Conventional Commits"
    release_trigger: "git tag interface-spec/v{version}"
    changelog_path: "05-CONFIGURATIONS/docs/CHANGELOG.md"

  audit_logging:
    log_when: "Toda vez que um agente consome esta especificação"
    log_fields: ["agent_id", "timestamp", "resolved_variables", "validation_result"]
    storage: "08-LOGS/interface-audit/{date}.jsonl"

  recovery:
    backup_frequency: "A cada commit para main"
    backup_location: "05-CONFIGURATIONS/.backups/interface-spec/"
    restore_command: "git restore 05-CONFIGURATIONS/interface-spec.yaml --source={commit_sha}"

# =============================================================================
# SEÇÃO 8: COMANDOS DE VALIDAÇÃO DO ARTEFATO
# =============================================================================

self_validation:
  commands:
    - name: "Validar sintaxe YAML"
      command: "yq eval '.' 05-CONFIGURATIONS/interface-spec.yaml > /dev/null && echo '✅ YAML válido'"
    
    - name: "Validar schema JSON"
      command: "python3 -c \"import jsonschema, yaml; spec=yaml.safe_load(open('05-CONFIGURATIONS/interface-spec.yaml')); jsonschema.validate(spec, spec['interface_schema'])\""
    
    - name: "Validar constraints com orchestrator-engine"
      command: "bash 05-CONFIGURATIONS/validation/orchestrator-engine.sh --domain configurations --file 05-CONFIGURATIONS/interface-spec.yaml --strict"
    
    - name: "Verificar checksum SHA256"
      command: "EXPECTED=$(grep 'checksum_sha256:' 05-CONFIGURATIONS/interface-spec.yaml | cut -d'\"' -f2); ACTUAL=$(sha256sum 05-CONFIGURATIONS/interface-spec.yaml | awk '{print $1}'); [ \"$EXPECTED\" = \"PENDING_GENERATION\" ] || [ \"$EXPECTED\" = \"$ACTUAL\" ] && echo '✅ Checksum válido' || echo '❌ Divergência de checksum'"
  
  acceptance_criteria:
    yaml_valid: true
    schema_valid: true
    constraints_passed: true
    checksum_matches: true

# =============================================================================
# FINAL DO DOCUMENTO
