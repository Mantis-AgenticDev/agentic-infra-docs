---
# FRONTMATTER CANÔNICO OBRIGATÓRIO
artifact_id: "interface-spec-v2.3.0"
artifact_type: "contract"
version: "2.3.0"
constraints_mapped: ["C2","C4","C5","V1"]
canonical_path: "05-CONFIGURATIONS/interface-spec.yaml"
domain: "05-CONFIGURATIONS"
subdomain: "coordination"
agent_role: "interface-contract"
