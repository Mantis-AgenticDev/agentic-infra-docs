# Qualquer alteração requer:
# 1. Aprovação humana (requires_human_approval_for_changes: true)
# 2. Atualização da versão no frontmatter
# 3. Regeneração do checksum_sha256 com verify-and-commit.sh
# 4. Commit atômico com mensagem rastreável
